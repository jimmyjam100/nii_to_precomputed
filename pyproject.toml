[project]
name = "nii_to_precomputed"
dynamic = ["version"]
description = "Utilities for converting .nii/.nii.gz volumes into Neuroglancer precomputed image or segmentation layers (with meshes), and serving them locally with HTTP requests."
authors = [
    { name = "Matthieu Chourrout", email = "83714683+chourroutm@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"

# Runtime dependencies go here
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.3.2",
    "cloud-volume>=12.8.0",
    "igneous-pipeline>=4.0",
    "rangehttpserver>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "versioningit"]
build-backend = "setuptools.build_meta"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "nii_to_precomputed/_version.py"
